services:
  db:
    image: postgres:18
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: ITMIM
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: P@ssw0rd
    # wait for postgres container to start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=ITMIM;Username=postgres;Password=P@ssw0rd"
      Jwt__Key: "28815892e9b7d3f6b9971026b04af6f2fe647fd2b3fd975fda8661944f0d6487"
      Jwt__Issuer: "ECommerceAPI"
      Jwt__Audience: "ECommerceAPI"
    depends_on:
      db:
        condition: service_healthy # makes sure postgres has actually accepted connections

volumes:
  pgdata:
